{% extends "base.html" %}

{% block title %}Connexion - TuberSYS 3.0{% endblock %}

{% block public_content %}
<div class="login-container">
    <div class="login-logo">
        <div class="login-logo-icon">TS</div>
        <h1>TuberSYS 3.0</h1>
        <p>ERP Ultra Complet - Connexion</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}" class="login-form">
        <div class="form-group">
            <label for="username">
                <i class="fas fa-user"></i> Nom d'utilisateur
            </label>
            <input type="text" id="username" name="username" required autofocus placeholder="Entrez votre nom d'utilisateur">
        </div>

        <div class="form-group">
            <label for="password">
                <i class="fas fa-lock"></i> Mot de passe
            </label>
            <input type="password" id="password" name="password" required placeholder="Entrez votre mot de passe">
        </div>

        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" name="remember" value="1">
                <span>Se souvenir de moi</span>
            </label>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
            <i class="fas fa-sign-in-alt"></i>
            Se connecter
        </button>
    </form>

    <div style="margin-top: 20px; text-align: center; color: var(--text-secondary); font-size: 12px;">
        <p>Par défaut : <strong>admin</strong> / <strong>admin123</strong></p>
    </div>
</div>
{% endblock %}
